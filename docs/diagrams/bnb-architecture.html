<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BnB-Kiosk System Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8f8f6;
      --color-ink:     #0b0c08;
      --color-muted:   #4f5246;
      --color-accent:  #465800;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · BnB-Kiosk</p>
    <h1>Two-app frontend with shared services and dual persistence</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnb-architecture-title bnb-architecture-desc">
        <title id="bnb-architecture-title">BnB-Kiosk system architecture</title>
        <desc id="bnb-architecture-desc">Architecture showing the Customer Kiosk, Staff Portal, and Customer Phone routing through shared Pinia stores and services to Supabase or dev localStorage.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5246"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#465800"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f6"/>

        <!-- Zones (drawn before arrows and nodes) -->
        <rect x="40" y="56" width="224" height="344" rx="8" fill="rgba(11,12,8,0.02)" stroke="rgba(11,12,8,0.10)" stroke-width="0.8"/>
        <rect x="96" y="60" width="112" height="12" rx="2" fill="#f8f8f6"/>
        <text x="152" y="69" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT APPS</text>

        <rect x="336" y="56" width="256" height="344" rx="8" fill="rgba(11,12,8,0.02)" stroke="rgba(11,12,8,0.10)" stroke-width="0.8"/>
        <rect x="392" y="60" width="144" height="12" rx="2" fill="#f8f8f6"/>
        <text x="464" y="69" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SHARED APP CORE</text>

        <rect x="664" y="56" width="256" height="344" rx="8" fill="rgba(11,12,8,0.02)" stroke="rgba(11,12,8,0.10)" stroke-width="0.8"/>
        <rect x="720" y="60" width="144" height="12" rx="2" fill="#f8f8f6"/>
        <text x="792" y="69" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA &amp; BACKEND</text>

        <!-- Arrows (drawn before nodes) -->
        <!-- Staff Portal -> Pinia Stores & Router -->
        <line x1="244" y1="136" x2="356" y2="136" stroke="#4f5246" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Pinia Stores & Router -> Service & Security -->
        <line x1="464" y1="168" x2="464" y2="236" stroke="#4f5246" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Customer Kiosk -> Service & Security (focal) -->
        <line x1="244" y1="252" x2="356" y2="252" stroke="#465800" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Customer Phone -> Service & Security (orthogonal elbow) -->
        <path d="M 244,348 H 292 Q 300,348 300,340 V 300 Q 300,292 308,292 H 356" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Service & Security -> Supabase Backend (orthogonal elbow) -->
        <path d="M 572,256 H 620 Q 628,256 628,248 V 164 Q 628,156 636,156 H 684" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Supabase Backend -> Pinia Stores & Router (Realtime push, dashed) -->
        <path d="M 684,124 H 572" fill="none" stroke="#4f5246" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Service & Security -> Dev LocalStorage (dashed fallback) -->
        <path d="M 572,284 H 684" fill="none" stroke="#4f5246" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque mask with >=6px gap from stroke) -->
        <rect x="272" y="116" width="60" height="12" rx="2" fill="#f8f8f6"/>
        <text x="302" y="125" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GUARDED</text>

        <rect x="472" y="196" width="44" height="12" rx="2" fill="#f8f8f6"/>
        <text x="494" y="205" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALLS</text>

        <rect x="276" y="232" width="48" height="12" rx="2" fill="#f8f8f6"/>
        <text x="300" y="241" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ORDERS</text>

        <rect x="252" y="328" width="36" height="12" rx="2" fill="#f8f8f6"/>
        <text x="270" y="337" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POLL</text>

        <rect x="632" y="136" width="48" height="12" rx="2" fill="#f8f8f6"/>
        <text x="656" y="145" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RPC/API</text>

        <rect x="600" y="104" width="56" height="12" rx="2" fill="#f8f8f6"/>
        <text x="628" y="113" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REALTIME</text>

        <rect x="596" y="292" width="64" height="12" rx="2" fill="#f8f8f6"/>
        <text x="628" y="301" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEV ONLY</text>

        <!-- Node: Staff Portal -->
        <rect x="60" y="104" width="184" height="64" rx="6" fill="#f8f8f6"/>
        <rect x="60" y="104" width="184" height="64" rx="6" fill="rgba(79,82,70,0.10)" stroke="#5f5e5a" stroke-width="1"/>
        <rect x="68" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(95,94,90,0.40)" stroke-width="0.8"/>
        <text x="82" y="121" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="152" y="140" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Staff Portal</text>
        <text x="152" y="156" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dist-staff/ · /queue</text>

        <!-- Node: Customer Kiosk -->
        <rect x="60" y="220" width="184" height="64" rx="6" fill="#f8f8f6"/>
        <rect x="60" y="220" width="184" height="64" rx="6" fill="rgba(79,82,70,0.10)" stroke="#5f5e5a" stroke-width="1"/>
        <rect x="68" y="228" width="28" height="12" rx="2" fill="transparent" stroke="rgba(95,94,90,0.40)" stroke-width="0.8"/>
        <text x="82" y="237" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPA</text>
        <text x="152" y="256" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Customer Kiosk</text>
        <text x="152" y="272" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dist/ · /menu /order</text>

        <!-- Node: Customer Phone -->
        <rect x="60" y="316" width="184" height="64" rx="6" fill="#f8f8f6"/>
        <rect x="60" y="316" width="184" height="64" rx="6" fill="rgba(11,12,8,0.03)" stroke="rgba(11,12,8,0.30)" stroke-width="1"/>
        <rect x="68" y="324" width="28" height="12" rx="2" fill="transparent" stroke="rgba(11,12,8,0.22)" stroke-width="0.8"/>
        <text x="82" y="333" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="152" y="352" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Customer Phone</text>
        <text x="152" y="368" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QR -> /order/:token</text>

        <!-- Node: Pinia Stores & Router -->
        <rect x="356" y="104" width="216" height="64" rx="6" fill="#f8f8f6"/>
        <rect x="356" y="104" width="216" height="64" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <rect x="364" y="112" width="36" height="12" rx="2" fill="transparent" stroke="rgba(11,12,8,0.40)" stroke-width="0.8"/>
        <text x="382" y="121" fill="#0b0c08" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="464" y="140" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pinia Stores &amp; Router</text>
        <text x="464" y="156" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth · orders · guards</text>

        <!-- Node: Service & Security (focal #1) -->
        <rect x="356" y="236" width="216" height="72" rx="6" fill="#f8f8f6"/>
        <rect x="356" y="236" width="216" height="72" rx="6" fill="rgba(70,88,0,0.08)" stroke="#465800" stroke-width="1.2"/>
        <rect x="364" y="244" width="32" height="12" rx="2" fill="transparent" stroke="rgba(70,88,0,0.50)" stroke-width="0.8"/>
        <text x="380" y="253" fill="#465800" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="464" y="276" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service &amp; Security</text>
        <text x="464" y="294" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orders · staff · security</text>

        <!-- Node: Supabase Backend (focal #2) -->
        <rect x="684" y="104" width="216" height="72" rx="6" fill="#f8f8f6"/>
        <rect x="684" y="104" width="216" height="72" rx="6" fill="rgba(70,88,0,0.08)" stroke="#465800" stroke-width="1.2"/>
        <rect x="692" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(70,88,0,0.50)" stroke-width="0.8"/>
        <text x="706" y="121" fill="#465800" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="792" y="144" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase Backend</text>
        <text x="792" y="162" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Auth · RPCs · Realtime · RLS</text>

        <!-- Node: Dev LocalStorage (optional) -->
        <rect x="684" y="252" width="216" height="64" rx="6" fill="#f8f8f6"/>
        <rect x="684" y="252" width="216" height="64" rx="6" fill="rgba(11,12,8,0.02)" stroke="rgba(11,12,8,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="692" y="260" width="28" height="12" rx="2" fill="transparent" stroke="rgba(11,12,8,0.28)" stroke-width="0.8"/>
        <text x="706" y="269" fill="#5f5e5a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text>
        <text x="792" y="288" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dev LocalStorage</text>
        <text x="792" y="304" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same-origin preview only</text>

        <!-- Legend strip -->
        <line x1="40" y1="436" x2="920" y2="436" stroke="rgba(11,12,8,0.10)" stroke-width="0.8"/>
        <text x="40" y="452" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="468" width="14" height="10" rx="2" fill="rgba(70,88,0,0.08)" stroke="#465800" stroke-width="1.2"/>
        <text x="60" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Focal layer</text>

        <rect x="156" y="468" width="14" height="10" rx="2" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <text x="176" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">App module</text>

        <rect x="276" y="468" width="14" height="10" rx="2" fill="rgba(79,82,70,0.10)" stroke="#5f5e5a" stroke-width="1"/>
        <text x="296" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Client SPA</text>

        <rect x="388" y="468" width="14" height="10" rx="2" fill="rgba(11,12,8,0.02)" stroke="rgba(11,12,8,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="408" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Dev fallback</text>

        <line x1="516" y1="474" x2="544" y2="474" stroke="#465800" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="552" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

        <line x1="652" y1="474" x2="680" y2="474" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="688" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">API / poll</text>

        <line x1="776" y1="474" x2="804" y2="474" stroke="#4f5246" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="812" y="476" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Async / fallback</text>
      </svg>
    </div>
  </div>
</body>
</html>
