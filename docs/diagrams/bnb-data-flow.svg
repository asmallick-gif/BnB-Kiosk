<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 728 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnb-data-flow-title bnb-data-flow-desc" id="bnb-data-flow-root">
        <title id="bnb-data-flow-title">BnB-Kiosk order and fulfillment data flow</title>
        <desc id="bnb-data-flow-desc">Customer Kiosk builds and submits a pending order to the Backend, Staff Portal verifies payment and advances preparation, Customer Kiosk tracks live status, and Staff Portal exports completed sales records.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bnb-data-flow-root { --paper: #f8f8f6; --paper-2: #f0efe8; --ink: #0b0c08; --muted: #4f5246;
      --soft: #5f5e5a; --rule: rgba(11,12,8,0.12); --accent: #465800;
      --accent-tint: rgba(70,88,0,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #bnb-data-flow-root { color: var(--ink); font-family: var(--sans); }
      #bnb-data-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#bnb-data-flow-root .diagram-container { overflow-x: visible; }
}
      #bnb-data-flow-root .step-number, #bnb-data-flow-root .step-label, #bnb-data-flow-root .lane-label, #bnb-data-flow-root .role-text, #bnb-data-flow-root .chip-text, #bnb-data-flow-root .legend-label { font-family: var(--mono); text-anchor: middle; }
      #bnb-data-flow-root .step-number { fill: var(--ink); font-size: 7px; font-weight: 600; }
      #bnb-data-flow-root .step-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; }
      #bnb-data-flow-root .lane-label { fill: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: 0.14em; }
      #bnb-data-flow-root .role-text { fill: var(--ink); font-size: 6px; font-weight: 600; }
      #bnb-data-flow-root .node-title { fill: var(--ink); font: 600 9px var(--sans); text-anchor: middle; }
      #bnb-data-flow-root .node-sub { fill: var(--muted); font: 400 6.5px var(--mono); text-anchor: middle; }
      #bnb-data-flow-root .node-tool { fill: var(--soft); font: 400 6.5px var(--mono); text-anchor: middle; }
      #bnb-data-flow-root .chip-text { fill: #fff; font-size: 5px; font-weight: 700; }
      #bnb-data-flow-root .focal-text { fill: var(--accent); }
      #bnb-data-flow-root .legend-label { fill: var(--muted); font-size: 7px; font-weight: 500; letter-spacing: 0.12em; text-anchor: end; }
      #bnb-data-flow-root .legend-text { fill: var(--muted); font: 400 7px var(--sans); }</style>
          <marker id="bnb-data-flow-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f5246"/></marker>
          <marker id="bnb-data-flow-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#465800"/></marker>
          <marker id="bnb-data-flow-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="728" height="356" fill="#f8f8f6"/>
        <rect x="0" y="36" width="728" height="80" fill="#0b0c08" fill-opacity="0.018"/>
        <rect x="0" y="196" width="728" height="80" fill="#0b0c08" fill-opacity="0.018"/>

        <!-- Header and lane dividers -->
        <line x1="0" y1="36" x2="728" y2="36" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="116" x2="728" y2="116" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="196" x2="728" y2="196" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="276" x2="728" y2="276" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="140" y1="36" x2="140" y2="276" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.12"/>

        <g aria-label="Pipeline steps">
          <rect x="180" y="6" width="32" height="16" rx="8" fill="#0b0c08" fill-opacity="0.12"/><text x="196" y="14" class="step-number">01</text><text x="196" y="29" class="step-label">ORDER</text>
          <rect x="292" y="6" width="32" height="16" rx="8" fill="#0b0c08" fill-opacity="0.12"/><text x="308" y="14" class="step-number">02</text><text x="308" y="29" class="step-label">PERSIST</text>
          <rect x="404" y="6" width="32" height="16" rx="8" fill="#465800" fill-opacity="0.20"/><text x="420" y="14" class="step-number focal-text">03</text><text x="420" y="29" class="step-label focal-text">CONFIRM</text>
          <rect x="516" y="6" width="32" height="16" rx="8" fill="#0b0c08" fill-opacity="0.12"/><text x="532" y="14" class="step-number">04</text><text x="532" y="29" class="step-label">PREPARE</text>
          <rect x="628" y="6" width="32" height="16" rx="8" fill="#0b0c08" fill-opacity="0.12"/><text x="644" y="14" class="step-number">05</text><text x="644" y="29" class="step-label">RECORD</text>
        </g>

        <g aria-label="Role lanes">
          <text x="70" y="72" class="lane-label">CUSTOMER</text><text x="70" y="84" class="lane-label">KIOSK</text>
          <text x="70" y="152" class="lane-label">STAFF</text><text x="70" y="164" class="lane-label">PORTAL</text>
          <text x="70" y="232" class="lane-label">BACKEND</text><text x="70" y="244" class="lane-label">DATABASE</text>
        </g>

        <!-- Connectors first (orthogonal r=8 elbows, focal arrow labeled) -->
        <path d="M246 76 H300 Q308 76 308 84 V204" fill="none" stroke="#4f5246" marker-end="url(#bnb-data-flow-arr-muted)"/>
        <path d="M358 236 H412 Q420 236 420 228 V188" fill="none" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-data-flow-arr-accent)"/>
        <path d="M470 156 H482" fill="none" stroke="#4f5246" marker-end="url(#bnb-data-flow-arr-muted)"/>
        <path d="M532 124 V108" fill="none" stroke="#2e5aa8" marker-end="url(#bnb-data-flow-arr-link)"/>
        <path d="M582 156 H594" fill="none" stroke="#4f5246" marker-end="url(#bnb-data-flow-arr-muted)"/>

        <!-- Focal arrow label (>=6px above stroke at y=236) -->
        <rect x="364" y="216" width="44" height="12" rx="2" fill="#f8f8f6"/>
        <text x="386" y="225" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING</text>

        <!-- Customer Kiosk: Build Cart (lane 0, step 0) -->
        <rect x="146" y="44" width="100" height="64" rx="6" fill="#f8f8f6" stroke="#0b0c08" stroke-opacity="0.25"/>
        <rect x="150" y="48" width="18" height="10" rx="3" fill="#0b0c08" fill-opacity="0.12"/><text x="159" y="53" class="role-text">CSK</text>
        <text x="196" y="67" class="node-title">Build Cart</text><text x="196" y="79" class="node-sub">menu -> request</text><text x="196" y="91" class="node-tool">Menu · Checkout</text>
        <rect x="150" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="158" y="104" class="chip-text">WB</text>
        <rect x="226" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="234" y="104" class="chip-text">WB</text>

        <!-- Backend: Save Pending (lane 2, step 1) -->
        <rect x="258" y="204" width="100" height="64" rx="6" fill="#f8f8f6" stroke="#0b0c08" stroke-opacity="0.25"/>
        <rect x="262" y="208" width="18" height="10" rx="3" fill="#0b0c08" fill-opacity="0.12"/><text x="271" y="213" class="role-text">API</text>
        <text x="308" y="227" class="node-title">Save Pending</text><text x="308" y="239" class="node-sub">create_kiosk_order</text><text x="308" y="251" class="node-tool">Supabase / local</text>
        <rect x="262" y="258" width="16" height="8" rx="3" fill="#6e6479"/><text x="270" y="264" class="chip-text">WB</text>
        <rect x="338" y="258" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="346" y="264" class="chip-text">DB</text>

        <!-- Staff Portal: Verify Payment (lane 1, step 2 — focal) -->
        <rect x="370" y="124" width="100" height="64" rx="6" fill="#465800" stroke="#465800" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="374" y="128" width="18" height="10" rx="3" fill="#465800" fill-opacity="0.20"/><text x="383" y="133" class="role-text focal-text">STF</text>
        <text x="420" y="147" class="node-title">Verify Payment</text><text x="420" y="159" class="node-sub">Proceed / Cancel</text><text x="420" y="171" class="node-tool">StaffQueueView</text>
        <rect x="374" y="178" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="382" y="184" class="chip-text">DB</text>
        <rect x="450" y="178" width="16" height="8" rx="3" fill="#4a7c59"/><text x="458" y="184" class="chip-text">LS</text>

        <!-- Staff Portal: Prep Stages (lane 1, step 3) -->
        <rect x="482" y="124" width="100" height="64" rx="6" fill="#f8f8f6" stroke="#0b0c08" stroke-opacity="0.25"/>
        <rect x="486" y="128" width="18" height="10" rx="3" fill="#0b0c08" fill-opacity="0.12"/><text x="495" y="133" class="role-text">STF</text>
        <text x="532" y="147" class="node-title">Prep Stages</text><text x="532" y="159" class="node-sub">cooking -> ready</text><text x="532" y="171" class="node-tool">StaffOrderCard</text>
        <rect x="486" y="178" width="16" height="8" rx="3" fill="#4a7c59"/><text x="494" y="184" class="chip-text">LS</text>
        <rect x="562" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="570" y="184" class="chip-text">TB</text>

        <!-- Customer Kiosk: Track Order (lane 0, step 3) -->
        <rect x="482" y="44" width="100" height="64" rx="6" fill="#f8f8f6" stroke="#0b0c08" stroke-opacity="0.25"/>
        <rect x="486" y="48" width="18" height="10" rx="3" fill="#0b0c08" fill-opacity="0.12"/><text x="495" y="53" class="role-text">CSK</text>
        <text x="532" y="67" class="node-title">Track Order</text><text x="532" y="79" class="node-sub">QR + 2.5s poll</text><text x="532" y="91" class="node-tool">OrderStatusView</text>
        <rect x="486" y="98" width="16" height="8" rx="3" fill="#4a7c59"/><text x="494" y="104" class="chip-text">LS</text>
        <rect x="562" y="98" width="16" height="8" rx="3" fill="#6e6479"/><text x="570" y="104" class="chip-text">WB</text>

        <!-- Staff Portal: Sales Records (lane 1, step 4) -->
        <rect x="594" y="124" width="100" height="64" rx="6" fill="#f8f8f6" stroke="#0b0c08" stroke-opacity="0.25"/>
        <rect x="598" y="128" width="18" height="10" rx="3" fill="#0b0c08" fill-opacity="0.12"/><text x="607" y="133" class="role-text">STF</text>
        <text x="644" y="147" class="node-title">Sales Records</text><text x="644" y="159" class="node-sub">summary + CSV</text><text x="644" y="171" class="node-tool">StaffRecordsView</text>
        <rect x="598" y="178" width="16" height="8" rx="3" fill="#b8915a"/><text x="606" y="184" class="chip-text">TB</text>
        <rect x="674" y="178" width="16" height="8" rx="3" fill="#9c6b50"/><text x="682" y="184" class="chip-text">FL</text>

        <!-- Legend: steps -->
        <text x="164" y="293" class="legend-label">STEPS</text>
        <rect x="180" y="284" width="24" height="12" rx="6" fill="#0b0c08" fill-opacity="0.12"/><text x="192" y="292" class="step-number">01</text><text x="212" y="293" class="legend-text">Order</text>
        <rect x="268" y="284" width="24" height="12" rx="6" fill="#0b0c08" fill-opacity="0.12"/><text x="280" y="292" class="step-number">02</text><text x="300" y="293" class="legend-text">Persist</text>
        <rect x="360" y="284" width="24" height="12" rx="6" fill="#465800" fill-opacity="0.20"/><text x="372" y="292" class="step-number focal-text">03</text><text x="392" y="293" class="legend-text">Confirm</text>
        <rect x="464" y="284" width="24" height="12" rx="6" fill="#0b0c08" fill-opacity="0.12"/><text x="476" y="292" class="step-number">04</text><text x="496" y="293" class="legend-text">Prepare</text>
        <rect x="564" y="284" width="24" height="12" rx="6" fill="#0b0c08" fill-opacity="0.12"/><text x="576" y="292" class="step-number">05</text><text x="596" y="293" class="legend-text">Record</text>

        <!-- Legend: data types -->
        <text x="164" y="314" class="legend-label">DATA TYPE</text>
        <rect x="180" y="306" width="16" height="8" rx="3" fill="#6e6479"/><text x="188" y="312" class="chip-text">WB</text><text x="202" y="314" class="legend-text">Web</text>
        <rect x="240" y="306" width="16" height="8" rx="3" fill="#5e7a9b"/><text x="248" y="312" class="chip-text">DB</text><text x="262" y="314" class="legend-text">Record</text>
        <rect x="312" y="306" width="16" height="8" rx="3" fill="#4a7c59"/><text x="320" y="312" class="chip-text">LS</text><text x="334" y="314" class="legend-text">Live</text>
        <rect x="372" y="306" width="16" height="8" rx="3" fill="#b8915a"/><text x="380" y="312" class="chip-text">TB</text><text x="394" y="314" class="legend-text">Table</text>
        <rect x="436" y="306" width="16" height="8" rx="3" fill="#9c6b50"/><text x="444" y="312" class="chip-text">FL</text><text x="458" y="314" class="legend-text">CSV</text>
        <text x="500" y="314" class="legend-text">left chip = input · right chip = output</text>

        <!-- Legend: flow -->
        <text x="164" y="336" class="legend-label">FLOW</text>
        <line x1="180" y1="333" x2="204" y2="333" stroke="#4f5246" marker-end="url(#bnb-data-flow-arr-muted)"/><text x="212" y="336" class="legend-text">Standard handoff</text>
        <line x1="324" y1="333" x2="348" y2="333" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-data-flow-arr-accent)"/><text x="356" y="336" class="legend-text">Cashier gate</text>
        <line x1="452" y1="333" x2="476" y2="333" stroke="#2e5aa8" marker-end="url(#bnb-data-flow-arr-link)"/><text x="484" y="336" class="legend-text">Published status</text>
      </svg>
