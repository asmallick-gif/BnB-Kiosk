<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BnB-Kiosk Domain and Store Class Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8f8f6;
      --color-ink:     #0b0c08;
      --color-muted:   #4f5246;
      --color-accent:  #465800;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML class · BnB-Kiosk</p>
    <h1>Core domain types, services, and Pinia stores</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnb-domain-classes-title bnb-domain-classes-desc">
        <title id="bnb-domain-classes-title">BnB-Kiosk core domain and store class diagram</title>
        <desc id="bnb-domain-classes-desc">UML class diagram showing KioskOrder composed of OrderItem, referenced by OrderService and StaffOrdersStore, alongside StaffAuthStore and StaffProduct.</desc>
        <defs>
          <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#0b0c08"/>
          </marker>
          <marker id="uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5246" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f6"/>

        <!-- Relationships (drawn before boxes) -->
        <!-- OrderService depends on KioskOrder -->
        <line x1="296" y1="108" x2="360" y2="108" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open)"/>
        <!-- KioskOrder composed of OrderItem -->
        <line x1="608" y1="108" x2="672" y2="108" stroke="#4f5246" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
        <!-- StaffOrdersStore aggregates KioskOrder -->
        <line x1="484" y1="264" x2="484" y2="196" stroke="#4f5246" stroke-width="1" marker-start="url(#uml-diamond-hollow)"/>
        <!-- OrderItem associates StaffProduct -->
        <line x1="796" y1="176" x2="796" y2="264" stroke="#4f5246" stroke-width="1" marker-end="url(#uml-open)"/>

        <!-- Relationship labels and multiplicities (>=6px off stroke) -->
        <rect x="310" y="88" width="36" height="12" rx="2" fill="#f8f8f6"/>
        <text x="328" y="97" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

        <rect x="616" y="88" width="16" height="12" rx="2" fill="#f8f8f6"/>
        <text x="624" y="97" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="640" y="88" width="24" height="12" rx="2" fill="#f8f8f6"/>
        <text x="652" y="97" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1..*</text>

        <rect x="492" y="244" width="16" height="12" rx="2" fill="#f8f8f6"/>
        <text x="500" y="253" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
        <rect x="492" y="204" width="24" height="12" rx="2" fill="#f8f8f6"/>
        <text x="504" y="213" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..*</text>

        <rect x="804" y="184" width="24" height="12" rx="2" fill="#f8f8f6"/>
        <text x="816" y="193" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..*</text>
        <rect x="804" y="244" width="16" height="12" rx="2" fill="#f8f8f6"/>
        <text x="812" y="253" fill="#0b0c08" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <!-- Class: OrderService -->
        <rect x="40" y="40" width="256" height="136" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="40" y1="80" x2="296" y2="80" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <text x="168" y="56" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«module»</text>
        <text x="168" y="72" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OrderService</text>
        <text x="56" y="100" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ submitOrder(req): KioskOrder</text>
        <text x="56" y="120" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ getOrder(token): KioskOrder</text>
        <text x="56" y="140" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ isOrderConfirmed(o): boolean</text>
        <text x="56" y="160" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ queueLabel(n): string</text>

        <!-- Class: KioskOrder (focal) -->
        <rect x="360" y="40" width="248" height="156" rx="6" fill="rgba(70,88,0,0.05)" stroke="#465800" stroke-width="1.2"/>
        <rect x="360" y="40" width="248" height="40" rx="6" fill="rgba(70,88,0,0.10)"/>
        <rect x="360" y="72" width="248" height="8" fill="rgba(70,88,0,0.10)"/>
        <line x1="360" y1="80" x2="608" y2="80" stroke="rgba(70,88,0,0.40)" stroke-width="1"/>
        <text x="484" y="56" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="484" y="72" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KioskOrder</text>
        <text x="376" y="100" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ token: string</text>
        <text x="376" y="120" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ requestId: string</text>
        <text x="376" y="140" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ queueNumber: number</text>
        <text x="376" y="160" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ status: OrderStatus</text>
        <text x="376" y="180" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ total: number</text>

        <!-- Class: OrderItem -->
        <rect x="672" y="40" width="248" height="136" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="672" y1="80" x2="920" y2="80" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <text x="796" y="56" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="796" y="72" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OrderItem</text>
        <text x="688" y="100" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ id: string</text>
        <text x="688" y="120" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ name: string</text>
        <text x="688" y="140" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ quantity: number</text>
        <text x="688" y="160" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ lineTotal: number</text>

        <!-- Class: StaffAuthStore -->
        <rect x="40" y="264" width="256" height="164" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="40" y1="304" x2="296" y2="304" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <line x1="40" y1="352" x2="296" y2="352" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <text x="168" y="280" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«store»</text>
        <text x="168" y="296" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffAuthStore</text>
        <text x="56" y="324" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ user: StaffUser | null</text>
        <text x="56" y="340" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ isAuthenticated: boolean</text>
        <text x="56" y="372" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ login(input): StaffUser</text>
        <text x="56" y="392" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ register(input): Result</text>
        <text x="56" y="412" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ updateProfile(in): StaffUser</text>

        <!-- Class: StaffOrdersStore -->
        <rect x="360" y="264" width="248" height="164" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="360" y1="304" x2="608" y2="304" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <line x1="360" y1="352" x2="608" y2="352" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <text x="484" y="280" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«store»</text>
        <text x="484" y="296" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffOrdersStore</text>
        <text x="376" y="324" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ orders: KioskOrder[]</text>
        <text x="376" y="340" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ activeCount: number</text>
        <text x="376" y="372" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ refresh(): Promise&lt;void&gt;</text>
        <text x="376" y="392" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ setOrderStatus(t, s): Order</text>
        <text x="376" y="412" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ startWatching(): () =&gt; void</text>

        <!-- Class: StaffProduct -->
        <rect x="672" y="264" width="248" height="156" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="672" y1="304" x2="920" y2="304" stroke="rgba(11,12,8,0.22)" stroke-width="1"/>
        <text x="796" y="280" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
        <text x="796" y="296" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffProduct</text>
        <text x="688" y="324" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ id: string</text>
        <text x="688" y="344" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ categoryId: string</text>
        <text x="688" y="364" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ price: number</text>
        <text x="688" y="384" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ available: boolean</text>
        <text x="688" y="404" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ quantity: number</text>

        <!-- Legend: relationship vocabulary (all 6 per UML class spec) -->
        <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(11,12,8,0.10)" stroke-width="0.8"/>
        <text x="40" y="488" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="508" x2="68" y2="508" stroke="#0b0c08" stroke-width="1" marker-end="url(#uml-triangle)"/>
        <text x="76" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="184" y1="508" x2="212" y2="508" stroke="#0b0c08" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#uml-triangle)"/>
        <text x="220" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

        <line x1="328" y1="508" x2="356" y2="508" stroke="#0b0c08" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
        <text x="364" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

        <line x1="484" y1="508" x2="512" y2="508" stroke="#0b0c08" stroke-width="1" marker-start="url(#uml-diamond-hollow)"/>
        <text x="520" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

        <line x1="636" y1="508" x2="664" y2="508" stroke="#4f5246" stroke-width="1" marker-end="url(#uml-open)"/>
        <text x="672" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

        <line x1="772" y1="508" x2="800" y2="508" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#uml-open)"/>
        <text x="808" y="512" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
      </svg>
    </div>
  </div>
</body>
</html>
