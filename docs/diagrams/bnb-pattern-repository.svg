<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnb-pattern-repository-title bnb-pattern-repository-desc" id="bnb-pattern-repository-root">
        <title id="bnb-pattern-repository-title">BnB-Kiosk Repository pattern class diagram</title>
        <desc id="bnb-pattern-repository-desc">UML class diagram showing Kiosk and Staff views depending on the OrderRepository contract, realized by Supabase RPC persistence and dev-only localStorage persistence.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bnb-pattern-repository-root { --color-paper:   #f8f8f6;
      --color-ink:     #0b0c08;
      --color-muted:   #4f5246;
      --color-accent:  #465800;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bnb-pattern-repository-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bnb-pattern-repository-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#bnb-pattern-repository-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="bnb-pattern-repository-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="bnb-pattern-repository-uml-triangle-accent" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f8f8f6" stroke="#465800" stroke-width="1.2"/>
          </marker>
          <marker id="bnb-pattern-repository-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#0b0c08"/>
          </marker>
          <marker id="bnb-pattern-repository-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="bnb-pattern-repository-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5246" stroke-width="1"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f6"/>

        <!-- Relationships (drawn before boxes) -->
        <!-- Client Views depend on OrderRepository -->
        <line x1="280" y1="108" x2="360" y2="108" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bnb-pattern-repository-uml-open)"/>
        <!-- SupabaseBackend realizes OrderRepository -->
        <line x1="428" y1="256" x2="428" y2="176" stroke="#465800" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bnb-pattern-repository-uml-triangle-accent)"/>
        <!-- LocalPreviewBackend realizes OrderRepository -->
        <line x1="596" y1="256" x2="596" y2="176" stroke="#465800" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bnb-pattern-repository-uml-triangle-accent)"/>

        <!-- Relationship label (>=6px clear of stroke) -->
        <rect x="302" y="88" width="36" height="12" rx="2" fill="#f8f8f6"/>
        <text x="320" y="97" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

        <!-- Client: Kiosk & Staff UI -->
        <rect x="40" y="52" width="240" height="112" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="40" y1="92" x2="280" y2="92" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="68" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«clients»</text>
        <text x="160" y="84" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Views &amp; Pinia Stores</text>
        <text x="56" y="112" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ Menu / Checkout / OrderStatus</text>
        <text x="56" y="132" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ useStaffOrdersStore</text>
        <text x="56" y="152" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ useStaffProductsStore</text>

        <!-- Focal Interface: Order & Product Repositories -->
        <rect x="360" y="40" width="304" height="136" rx="6" fill="#465800" stroke="#465800" stroke-width="1.2" fill-opacity="0.05"/>
        <rect x="360" y="40" width="304" height="40" rx="6" fill="#465800" fill-opacity="0.10"/>
        <rect x="360" y="72" width="304" height="8" fill="#465800" fill-opacity="0.10"/>
        <line x1="360" y1="80" x2="664" y2="80" stroke="#465800" stroke-width="1" stroke-opacity="0.40"/>
        <text x="512" y="56" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«repository contract»</text>
        <text x="512" y="72" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Service Repositories (src/services)</text>
        <text x="376" y="100" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ listMenuProducts(): Category[]</text>
        <text x="376" y="120" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ submitOrder / getOrder</text>
        <text x="376" y="140" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ listStaffOrders / updateStatus</text>
        <text x="376" y="160" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ listStaffProducts / updateStock</text>

        <!-- Concrete Backend 1: Supabase -->
        <rect x="160" y="256" width="316" height="128" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="160" y1="296" x2="476" y2="296" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="318" y="272" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«production backend»</text>
        <text x="318" y="288" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supabase RPC &amp; PostgREST</text>
        <text x="176" y="316" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ rpc('create_kiosk_order', ...)</text>
        <text x="176" y="336" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ rpc('staff_update_order_status')</text>
        <text x="176" y="356" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ from('products').select(...)</text>
        <text x="176" y="372" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace">active when VITE_SUPABASE_* set</text>

        <!-- Concrete Backend 2: Local Dev Preview -->
        <rect x="548" y="256" width="316" height="128" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="548" y1="296" x2="864" y2="296" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="706" y="272" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«dev-only backend»</text>
        <text x="706" y="288" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LocalStorage Preview Store</text>
        <text x="564" y="316" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ key: bnb.demo-order.&lt;requestId&gt;</text>
        <text x="564" y="336" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ key: bnb.demo-products</text>
        <text x="564" y="356" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ navigator.locks + storage event</text>
        <text x="564" y="372" fill="#4f5246" font-size="9" font-family="'Geist Mono', monospace">disabled in production builds</text>

        <!-- Legend: relationship vocabulary -->
        <line x1="40" y1="424" x2="920" y2="424" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="440" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="460" x2="68" y2="460" stroke="#0b0c08" stroke-width="1" marker-end="url(#bnb-pattern-repository-uml-triangle)"/>
        <text x="76" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="184" y1="460" x2="212" y2="460" stroke="#465800" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bnb-pattern-repository-uml-triangle-accent)"/>
        <text x="220" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Realization · implements</text>

        <line x1="364" y1="460" x2="392" y2="460" stroke="#0b0c08" stroke-width="1" marker-start="url(#bnb-pattern-repository-uml-diamond-filled)"/>
        <text x="400" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Composition</text>

        <line x1="504" y1="460" x2="532" y2="460" stroke="#0b0c08" stroke-width="1" marker-start="url(#bnb-pattern-repository-uml-diamond-hollow)"/>
        <text x="540" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Aggregation</text>

        <line x1="644" y1="460" x2="672" y2="460" stroke="#4f5246" stroke-width="1" marker-end="url(#bnb-pattern-repository-uml-open)"/>
        <text x="680" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

        <line x1="776" y1="460" x2="804" y2="460" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bnb-pattern-repository-uml-open)"/>
        <text x="812" y="464" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
      </svg>
