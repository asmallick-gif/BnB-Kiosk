<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnb-pattern-observer-title bnb-pattern-observer-desc" id="bnb-pattern-observer-root">
        <title id="bnb-pattern-observer-title">BnB-Kiosk Observer pattern class diagram</title>
        <desc id="bnb-pattern-observer-desc">UML class diagram showing StaffOrdersStore subscribing to Realtime or browser storage events and notifying StaffShellView, StaffQueueView, and StaffRecordsView reactively.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #bnb-pattern-observer-root { --color-paper:   #f8f8f6;
      --color-ink:     #0b0c08;
      --color-muted:   #4f5246;
      --color-accent:  #465800;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #bnb-pattern-observer-root { font-family: var(--font-sans); color: var(--color-ink); }
      #bnb-pattern-observer-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#bnb-pattern-observer-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="bnb-pattern-observer-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 16 6, 0 12" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="bnb-pattern-observer-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#0b0c08"/>
          </marker>
          <marker id="bnb-pattern-observer-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f8f8f6" stroke="#0b0c08" stroke-width="1"/>
          </marker>
          <marker id="bnb-pattern-observer-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5246" stroke-width="1"/>
          </marker>
          <marker id="bnb-pattern-observer-uml-open-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#465800" stroke-width="1.2"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f6"/>

        <!-- Relationships (drawn before boxes) -->
        <!-- StaffOrdersStore subscribes to OrderEventSource -->
        <line x1="512" y1="116" x2="384" y2="116" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bnb-pattern-observer-uml-open)"/>
        <!-- Observers -> StaffOrdersStore (fanned ports at x=564, 660, 756; zero crossings) -->
        <path d="M 160,284 V 236 Q 160,228 168,228 H 556 Q 564,228 564,220 V 196" fill="none" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-pattern-observer-uml-open-accent)"/>
        <path d="M 480,284 V 256 Q 480,248 488,248 H 652 Q 660,248 660,240 V 196" fill="none" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-pattern-observer-uml-open-accent)"/>
        <path d="M 800,284 V 236 Q 800,228 792,228 H 764 Q 756,228 756,220 V 196" fill="none" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-pattern-observer-uml-open-accent)"/>

        <!-- Relationship labels (>=6px clear of strokes) -->
        <rect x="412" y="96" width="72" height="12" rx="2" fill="#f8f8f6"/>
        <text x="448" y="105" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUBSCRIBES</text>

        <rect x="312" y="208" width="60" height="12" rx="2" fill="#f8f8f6"/>
        <text x="342" y="217" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVES</text>

        <!-- Class: OrderEventSource -->
        <rect x="112" y="56" width="272" height="124" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="112" y1="96" x2="384" y2="96" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="248" y="72" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«event source»</text>
        <text x="248" y="88" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">subscribeStaffOrders</text>
        <text x="128" y="116" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ postgres_changes(public.orders)</text>
        <text x="128" y="136" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ window.storage(bnb.demo-order.*)</text>
        <text x="128" y="156" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ returns: () =&gt; void (cleanup)</text>

        <!-- Class: StaffOrdersStore (focal subject) -->
        <rect x="512" y="40" width="296" height="156" rx="6" fill="#465800" stroke="#465800" stroke-width="1.2" fill-opacity="0.05"/>
        <rect x="512" y="40" width="296" height="40" rx="6" fill="#465800" fill-opacity="0.10"/>
        <rect x="512" y="72" width="296" height="8" fill="#465800" fill-opacity="0.10"/>
        <line x1="512" y1="80" x2="808" y2="80" stroke="#465800" stroke-width="1" stroke-opacity="0.40"/>
        <line x1="512" y1="140" x2="808" y2="140" stroke="#465800" stroke-width="1" stroke-opacity="0.28"/>
        <text x="660" y="56" fill="#465800" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«subject · store»</text>
        <text x="660" y="72" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useStaffOrdersStore</text>
        <text x="528" y="100" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">- subscriberCount: number</text>
        <text x="528" y="116" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ orders: Ref&lt;KioskOrder[]&gt;</text>
        <text x="528" y="132" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ activeCount / waiting / ready</text>
        <text x="528" y="160" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ startWatching(): () =&gt; void</text>
        <text x="528" y="180" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ refresh() / setOrderStatus()</text>

        <!-- Observer 1: StaffShellView -->
        <rect x="40" y="284" width="240" height="108" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="40" y1="324" x2="280" y2="324" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="160" y="300" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«observer»</text>
        <text x="160" y="316" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffShellView</text>
        <text x="56" y="344" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ onMounted: startWatching()</text>
        <text x="56" y="364" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ renders: activeCount badge</text>

        <!-- Observer 2: StaffQueueView -->
        <rect x="360" y="284" width="240" height="108" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="360" y1="324" x2="600" y2="324" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="480" y="300" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«observer»</text>
        <text x="480" y="316" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffQueueView</text>
        <text x="376" y="344" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ reads: waiting/cooking/ready</text>
        <text x="376" y="364" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ calls: setOrderStatus()</text>

        <!-- Observer 3: StaffRecordsView -->
        <rect x="680" y="284" width="240" height="108" rx="6" fill="#ffffff" stroke="#0b0c08" stroke-width="1"/>
        <line x1="680" y1="324" x2="920" y2="324" stroke="#0b0c08" stroke-width="1" stroke-opacity="0.22"/>
        <text x="800" y="300" fill="#5f5e5a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«observer»</text>
        <text x="800" y="316" fill="#0b0c08" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StaffRecordsView</text>
        <text x="696" y="344" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ reads: orders (filtered)</text>
        <text x="696" y="364" fill="#0b0c08" font-size="9" font-family="'Geist Mono', monospace">+ renders: totals &amp; CSV</text>

        <!-- Legend: relationship vocabulary -->
        <line x1="40" y1="432" x2="920" y2="432" stroke="#0b0c08" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="448" fill="#4f5246" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

        <line x1="40" y1="468" x2="68" y2="468" stroke="#0b0c08" stroke-width="1" marker-end="url(#bnb-pattern-observer-uml-triangle)"/>
        <text x="76" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

        <line x1="184" y1="468" x2="212" y2="468" stroke="#0b0c08" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#bnb-pattern-observer-uml-triangle)"/>
        <text x="220" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

        <line x1="328" y1="468" x2="356" y2="468" stroke="#0b0c08" stroke-width="1" marker-start="url(#bnb-pattern-observer-uml-diamond-filled)"/>
        <text x="364" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

        <line x1="484" y1="468" x2="512" y2="468" stroke="#0b0c08" stroke-width="1" marker-start="url(#bnb-pattern-observer-uml-diamond-hollow)"/>
        <text x="520" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

        <line x1="636" y1="468" x2="664" y2="468" stroke="#465800" stroke-width="1.2" marker-end="url(#bnb-pattern-observer-uml-open-accent)"/>
        <text x="672" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Association · observes</text>

        <line x1="788" y1="468" x2="816" y2="468" stroke="#4f5246" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#bnb-pattern-observer-uml-open)"/>
        <text x="824" y="472" fill="#4f5246" font-size="8.5" font-family="'Geist', sans-serif">Dependency</text>
      </svg>
